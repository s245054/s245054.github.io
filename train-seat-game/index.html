<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>北九州モノレールの席えらび</title>
<link rel="stylesheet" href="styles.css">
</head>
<body><main class="wrap"><div class="top"><div class="brand">🚝 北九州モノレール</div><button class="sound" id="sound">♪ モノレール運行中</button></div><header class="hero"><h1>北九州モノレールの席えらび</h1><p>小倉駅から企救丘駅へ、13駅の旅</p></header>
<section class="game"><div class="bar"><div class="stage-pill" id="stageLabel">STAGE 1 / 13</div><div class="progress" id="progress"></div><div class="score">★ <span id="totalScore">0</span> pt</div></div>
<div class="mission"><div><div class="station-heading"><strong id="stageTitle"></strong><span class="next-station" id="nextStation"></span></div><small id="stageDesc"></small></div><div class="goal" id="goal"></div></div>
<div class="scene"><div class="outside" aria-label="窓の外の景色">
  <div class="landscape-window"><div class="landscape-track" id="landscapeTrack"></div>
    <div class="platform-scene" id="platformScene"><i class="platform-post post-a"></i><i class="platform-post post-b"></i><i class="platform-post post-c"></i><div class="platform-edge"></div><div class="station-board"><small>停車中</small><b id="outsideStation">小倉駅</b></div></div>
  </div>
  <span class="outside-caption">窓の外の沿線風景</span><span class="route-status" id="routeStatus" hidden></span>
</div><div class="train-front"><span>企救丘ゆき</span><span class="front-arrow">▶</span></div><div class="car-shell"><div class="car"><div class="cabin" id="seatGrid"></div><div class="driver" aria-label="運転席"><div class="instrument-stack" aria-label="丸い計器が3つ"><i class="gauge"></i><i class="gauge"></i><i class="gauge"></i></div><span class="driver-label">運転席</span></div></div><div class="wheelset" aria-hidden="true"><i></i><i></i></div></div><div class="seat-hint">壁沿いロングシート：ドア横・真ん中・連結部の席　／　隣席は同じベンチ内のみ　／　吊り革で立てます</div></div>
<div class="people-title">乗客さん <span style="font-size:12px;color:#9a927b;font-weight:500">（乗客を選んでから席をタップ）</span></div><div class="passengers" id="passengers"></div>
<div class="bottom"><div class="tip" id="tip">希望をかなえるとボーナスがもらえるよ。</div><div class="buttons"><button class="btn reset" id="reset">やりなおす</button><button class="btn next" id="next" disabled>採点する →</button></div></div><div class="toast" id="toast"></div></section><div class="footer">あせらず、のんびり。いい旅になりますように。 ☁<br><a href="https://dot-illust.net/category/character/" target="_blank" rel="noopener">人物ドット絵：DOT ILLUST</a></div></main>
<div class="result" id="result"><div class="card"><div id="resultIcon" style="font-size:40px">🚝</div><h2 id="resultTitle">いい旅でした！</h2><div class="stars" id="resultStars"></div><p id="resultText"></p><div id="resultFeedback" class="feedback-list"></div><button class="btn next" id="resultNext">つぎの駅へ →</button></div></div>
<div class="tutorial-layer" id="tutorialLayer" hidden><div class="tutorial-dim"></div></div><section class="tutorial-bubble" id="tutorialBubble" role="status" aria-live="polite" hidden><strong id="tutorialStep"></strong><p id="tutorialMessage"></p><button type="button" id="tutorialClose">ガイドを閉じる</button></section>
<script src="script.js"></script></body></html>
